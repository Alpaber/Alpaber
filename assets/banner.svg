<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="PABLO.RDZ — Full Stack Developer. Próximo nivel: IA y Big Data">
  <style>
    .gc { animation: gc 4s steps(1) infinite; }
    .gm { animation: gm 4s steps(1) infinite; }
    @keyframes gc { 0%,90%,100% { transform: translate(0,0); } 92% { transform: translate(5px,-2px); } 95% { transform: translate(-4px,1px); } }
    @keyframes gm { 0%,90%,100% { transform: translate(0,0); } 92% { transform: translate(-5px,2px); } 95% { transform: translate(4px,-1px); } }

    .xp { animation: xp 3.5s ease-out forwards; }
    @keyframes xp { from { width: 0; } to { width: 186px; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#00F0FF" flood-opacity=".55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="r"><rect width="1200" height="400" rx="16"/></clipPath>
    <radialGradient id="mg" cx="88%" cy="15%" r="50%"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".22"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cg" cx="0%" cy="100%" r="55%"><stop offset="0" stop-color="#00F0FF" stop-opacity=".14"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF2BD6" stop-opacity="0"/><stop offset="1" stop-color="#FF2BD6" stop-opacity=".35"/></linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="400" fill="#07020F"/>
    <rect width="1200" height="400" fill="url(#mg)"/>
    <rect width="1200" height="400" fill="url(#cg)"/>
    <!-- suelo en perspectiva tipo synthwave -->
    <g stroke="url(#floor)" stroke-width="1.2">
      <line x1="852" y1="270" x2="540" y2="400"/><line x1="870" y1="270" x2="610" y2="400"/><line x1="888" y1="270" x2="680" y2="400"/><line x1="906" y1="270" x2="750" y2="400"/><line x1="924" y1="270" x2="820" y2="400"/><line x1="942" y1="270" x2="890" y2="400"/><line x1="960" y1="270" x2="960" y2="400"/><line x1="978" y1="270" x2="1030" y2="400"/><line x1="996" y1="270" x2="1100" y2="400"/><line x1="1014" y1="270" x2="1170" y2="400"/><line x1="1032" y1="270" x2="1240" y2="400"/><line x1="1050" y1="270" x2="1310" y2="400"/><line x1="1068" y1="270" x2="1380" y2="400"/>
      <line x1="760" y1="278" x2="1200" y2="278"/><line x1="760" y1="292" x2="1200" y2="292"/><line x1="760" y1="312" x2="1200" y2="312"/><line x1="760" y1="340" x2="1200" y2="340"/><line x1="760" y1="378" x2="1200" y2="378"/>
    </g>
    <!-- sol retro -->
    <clipPath id="sky"><rect x="760" y="0" width="440" height="268"/></clipPath>
    <g clip-path="url(#sky)"><g transform="translate(960 250)">
      <circle r="92" fill="#FF2BD6" fill-opacity=".85"/>
      <g fill="#07020F"><rect x="-100" y="-30" width="200" height="3"/><rect x="-100" y="-12" width="200" height="5"/><rect x="-100" y="4" width="200" height="7"/></g>
    </g></g>
    <rect width="1200" height="400" fill="url(#scan)"/>
