name: Actividad (snake)

on:
  schedule:
    - cron: "0 3 * * *"   # cada día a las 03:00 UTC
  workflow_dispatch:       # botón para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF2BD6&color_dots=#161B22,#123A4A,#0A7A8A,#00B8CC,#00F0FF
            dist/snake-light.svg?palette=github-light&color_snake=#FF2BD6&color_dots=#EBEDF0,#B3F5FA,#66E4EE,#1FC7D6,#00A3B3

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
